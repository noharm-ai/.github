name: Default CI Checks

on:
  pull_request:
    branches: [main, master, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify all package manager calls in Makefile use sfw
        id: sfw-check
        continue-on-error: true
        run: |
          violations=$(grep -nE '\b(npm |uv sync|uv run|pip install|yarn |pnpm )' Makefile \
            | grep -vE '^[0-9]+:[[:space:]]*#' \
            | grep -vE '\bsfw ' || true)
          if [ -n "$violations" ]; then
            echo "Found package manager calls not wrapped with sfw:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all package manager calls in workflow files use sfw
        id: sfw-check-workflows
        continue-on-error: true
        run: |
          violations=$(grep -rnE '\b(npm |uv sync|uv run|pip install|yarn |pnpm )' .github/workflows/ \
            --exclude='security-check.yml' \
            --exclude='shared.yml' \
            --exclude='default.yml' \
            | grep -vE ':[[:space:]]*#' \
            | grep -vE '\bsfw ' || true)
          if [ -n "$violations" ]; then
            echo "Found package manager calls not wrapped with sfw in workflow files:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all GitHub Actions are pinned to a SHA
        id: sha-pin-check
        continue-on-error: true
        run: |
          violations=$(grep -rnE '^\s+(- )?uses:\s+[^.]' .github/workflows/ \
            --exclude='shared.yml' \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|#|$)' || true)
          if [ -n "$violations" ]; then
            echo "Found GitHub Actions not pinned to a full commit SHA:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all package.json dependencies use fixed versions
        id: package-json-check
        continue-on-error: true
        run: |
          violations=$(find . -name package.json -not -path '*/node_modules/*' \
            -exec grep -nE '"[^"]+": "([~^]|>=|>|<=|<|\*)' {} + || true)
          if [ -n "$violations" ]; then
            echo "Found non-fixed dependency versions in package.json files:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all requirements.txt dependencies use fixed versions
        id: requirements-check
        continue-on-error: true
        run: |
          violations=$(find . -name 'requirements*.txt' -not -path '*/node_modules/*' \
            -exec grep -nE '^[a-zA-Z0-9]' {} + \
            | grep -vE '==' || true)
          if [ -n "$violations" ]; then
            echo "Found non-pinned dependency versions in requirements.txt files:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all pyproject.toml dependencies use fixed versions
        id: pyproject-check
        continue-on-error: true
        run: |
          violations=$(find . -name 'pyproject.toml' -not -path '*/node_modules/*' -print | \
            while IFS= read -r f; do
              awk '/^\[build-system\]/{skip=1;next} /^\[[^]]+\]/{skip=0} !skip' "$f" | \
              grep -E '(>=|<=|!=|~=|[~^])[0-9]' | \
              grep -v 'requires-python' | \
              sed "s|^|$f: |"
            done || true)
          if [ -n "$violations" ]; then
            echo "Found non-pinned dependency versions in pyproject.toml files:"
            echo "$violations"
            exit 1
          fi

      - name: Fail if any check failed
        if: |
          steps.sfw-check.outcome == 'failure' ||
          steps.sfw-check-workflows.outcome == 'failure' ||
          steps.sha-pin-check.outcome == 'failure' ||
          steps.package-json-check.outcome == 'failure' ||
          steps.requirements-check.outcome == 'failure' ||
          steps.pyproject-check.outcome == 'failure'
        run: exit 1

  iac-policy:
    name: IaC policy (cfn-guard + cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Discover CloudFormation/SAM templates
        id: discover
        run: |
          templates=$(grep -rlE 'AWSTemplateFormatVersion|Transform:\s*AWS::Serverless' \
            --include='*.yaml' --include='*.yml' . \
            | grep -v node_modules \
            | grep -v '^\./\.github/' || true)
          if [ -n "$templates" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "templates<<EOF"
              echo "$templates"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "CloudFormation/SAM templates encontrados:"
            echo "$templates"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum template CloudFormation/SAM encontrado; pulando IaC policy."
          fi

      - name: Check out shared cfn-guard rules
        if: steps.discover.outputs.found == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: noharm-ai/.github
          ref: main
          path: .noharm-shared

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.discover.outputs.found == 'true'
        with:
          python-version: "3.12"

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        if: steps.discover.outputs.found == 'true'
        with:
          mode: firewall-free

      - name: Install cfn-lint
        if: steps.discover.outputs.found == 'true'
        run: sfw pip install "cfn-lint==1.51.5"

      - name: Install cfn-guard
        if: steps.discover.outputs.found == 'true'
        run: |
          # -f: falha (exit != 0) em erro HTTP em vez de salvar a página de erro como
          # se fosse o tarball; --retry: sobrevive a blips transitórios da CDN do GitHub
          # (causa do sha256 FAILED — o asset e o hash pinado estão corretos/imutáveis).
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.0/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz -o cfn-guard.tar.gz
          echo "9f8c4d9f15f7dd54a37ea70a5237ba00aba682fb1e6521a744d12259961dfc13  cfn-guard.tar.gz" | sha256sum -c -
          tar -xzf cfn-guard.tar.gz
          echo "$PWD/cfn-guard-v3-x86_64-ubuntu-latest" >> "$GITHUB_PATH"

      - name: cfn-lint + cfn-guard (IAM least-privilege)
        if: steps.discover.outputs.found == 'true'
        run: |
          while IFS= read -r template; do
            [ -z "$template" ] && continue
            echo "::group::Validando $template"
            cfn-lint "$template"
            cfn-guard validate --rules .noharm-shared/cfn-guard/iam-least-privilege.guard --data "$template"
            echo "::endgroup::"
          done <<< "${{ steps.discover.outputs.templates }}"
