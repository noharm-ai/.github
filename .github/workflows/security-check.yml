name: Security Checks

on:
  pull_request:
    branches: [main, master, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  sfw-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify all package manager calls in Makefile use sfw
        run: |
          violations=$(grep -nE '\b(npm |uv sync|uv run|pip install|yarn |pnpm )' Makefile \
            | grep -vE '^[0-9]+:[[:space:]]*#' \
            | grep -vE '\bsfw ')
          if [ -n "$violations" ]; then
            echo "Found package manager calls not wrapped with sfw:"
            echo "$violations"
            exit 1
          fi

  sha-pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify all GitHub Actions are pinned to a SHA
        run: |
          violations=$(grep -rnE '^\s+(- )?uses:\s+[^.]' .github/workflows/ \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|#|$)')
          if [ -n "$violations" ]; then
            echo "Found GitHub Actions not pinned to a full commit SHA:"
            echo "$violations"
            exit 1
          fi
