name: Security Checks

on:
  pull_request:
    branches: [main, master, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify all package manager calls in Makefile use sfw
        id: sfw-check
        continue-on-error: true
        run: |
          violations=$(grep -nE '\b(npm |uv sync|uv run|pip install|yarn |pnpm )' Makefile \
            | grep -vE '^[0-9]+:[[:space:]]*#' \
            | grep -vE '\bsfw ' || true)
          if [ -n "$violations" ]; then
            echo "Found package manager calls not wrapped with sfw:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all package manager calls in workflow files use sfw
        id: sfw-check-workflows
        continue-on-error: true
        run: |
          violations=$(grep -rnE '\b(npm |uv sync|uv run|pip install|yarn |pnpm )' .github/workflows/ \
            --exclude='security-check.yml' \
            --exclude='shared.yml' \
            | grep -vE ':[[:space:]]*#' \
            | grep -vE '\bsfw ' || true)
          if [ -n "$violations" ]; then
            echo "Found package manager calls not wrapped with sfw in workflow files:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all GitHub Actions are pinned to a SHA
        id: sha-pin-check
        continue-on-error: true
        run: |
          violations=$(grep -rnE '^\s+(- )?uses:\s+[^.]' .github/workflows/ \
            --exclude='shared.yml' \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|#|$)' || true)
          if [ -n "$violations" ]; then
            echo "Found GitHub Actions not pinned to a full commit SHA:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all package.json dependencies use fixed versions
        id: package-json-check
        continue-on-error: true
        run: |
          violations=$(find . -name package.json -not -path '*/node_modules/*' \
            -exec grep -nE '"[^"]+": "([~^]|>=|>|<=|<|\*)' {} + || true)
          if [ -n "$violations" ]; then
            echo "Found non-fixed dependency versions in package.json files:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all requirements.txt dependencies use fixed versions
        id: requirements-check
        continue-on-error: true
        run: |
          violations=$(find . -name 'requirements*.txt' -not -path '*/node_modules/*' \
            -exec grep -nE '^[a-zA-Z0-9]' {} + \
            | grep -vE '==' || true)
          if [ -n "$violations" ]; then
            echo "Found non-pinned dependency versions in requirements.txt files:"
            echo "$violations"
            exit 1
          fi

      - name: Verify all pyproject.toml dependencies use fixed versions
        id: pyproject-check
        continue-on-error: true
        run: |
          violations=$(find . -name 'pyproject.toml' -not -path '*/node_modules/*' -print | \
            while IFS= read -r f; do
              awk '/^\[build-system\]/{skip=1;next} /^\[[^]]+\]/{skip=0} !skip' "$f" | \
              grep -E '(>=|<=|!=|~=|[~^])[0-9]' | \
              grep -v 'requires-python' | \
              sed "s|^|$f: |"
            done || true)
          if [ -n "$violations" ]; then
            echo "Found non-pinned dependency versions in pyproject.toml files:"
            echo "$violations"
            exit 1
          fi

      - name: Fail if any check failed
        if: |
          steps.sfw-check.outcome == 'failure' ||
          steps.sfw-check-workflows.outcome == 'failure' ||
          steps.sha-pin-check.outcome == 'failure' ||
          steps.package-json-check.outcome == 'failure' ||
          steps.requirements-check.outcome == 'failure' ||
          steps.pyproject-check.outcome == 'failure'
        run: exit 1
